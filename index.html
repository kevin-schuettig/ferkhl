<!doctype html>
<html lang="de">
<head>
  <!-- ?v=… an den Dateien: Versionsstempel gegen alten Browser-Cache.
       Bei jeder Änderung an CSS/JS/Icons neu setzen (JJMMTTHHMM). -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0c0b">
  <title>Ferkhl Mix Archive</title>
  <meta name="description" content="Ferkhl Mix Archive">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=2611162305">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png?v=2611162305">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=2611162305">
  <!-- PWA: vom Home-Bildschirm ohne Browser-Leisten starten -->
  <link rel="manifest" href="./manifest.webmanifest?v=2611162305">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ferkhl Mixes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./styles/main.css?v=2611162305">
</head>
<body>
  <!-- Header wie auf der Website: sticky, 6-px-Linie, Negativ über dem Inhalt -->
  <!-- Kein id="top" hier: #top springt so an den Seitenanfang (sticky Header wäre immer „schon da“) -->
  <header class="site-header">
    <h1 class="brand"><a href="#top"><img class="brand-logo" src="./assets/apple-touch-icon.png?v=2611162305" alt="" width="64" height="64">Ferkhl Mix Archive</a></h1>
    <nav id="years" class="years" aria-label="Jahre" hidden></nav>
  </header>

  <!-- Scroll-Streifen rechts: fester Bereich zum Scrollen mit dem Daumen
       (über den SoundCloud-iframes scrollt die Seite auf dem Handy schlecht) -->
  <div class="rail" aria-hidden="true"><span class="rail-text">Oink Oink</span></div>

  <main>
    <section class="intro wrap">
      <p id="kicker" class="label">Alle Mixes</p>
    </section>

    <div id="list" class="list wrap"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a href="#top" class="to-top">Nach oben ↑</a>
    </div>
  </footer>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="./scripts/mixes.js?v=2611162305"></script>
  <script src="./scripts/app.js?v=2611162305"></script>
</body>
</html>
